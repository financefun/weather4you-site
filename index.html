<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather4You</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --fg: #f5f5f7; --accent: #409cff; } }
  :root[data-theme="dark"] { --bg: #000; --fg: #f5f5f7; --accent: #409cff; }
  body { margin: 0; padding: 64px 16px; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Weather4You</h1>
  <p>A fast, focused weather app for iPhone and Apple Watch, built on National Weather Service forecasts, with Apple Weather powering Next Hour Rain for Pro subscribers.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
